name: zhkh_app_new

description: "Учет показаний ЖКХ"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Charts
  fl_chart: ^1.2.0

  # SQLite
  sqflite: ^2.3.2
  path: ^1.9.0

  # Local storage for tariffs
  hive: ^2.2.3
