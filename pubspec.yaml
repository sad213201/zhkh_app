  # REST API
  dio: ^5.0.0

  # Camera + OCR
  camera: ^0.10.5+9
  google_mlkit_text_recognition: ^0.14.0

  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true